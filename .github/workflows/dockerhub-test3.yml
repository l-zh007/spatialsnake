name: Build and Push test3 Docker Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing test3 archive chunks
        required: true
        default: test3-env-0.0.2-20260719
      image_tag:
        description: Docker image tag to publish
        required: true
        default: 0.0.2-test3-20260719
      push_latest:
        description: Also push the latest tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Download packed test3 environment chunks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p docker/test3/artifacts
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'test3-linux-64.tar.gz.part-*' \
            --dir docker/test3/artifacts
          ls -lh docker/test3/artifacts

      - name: Reassemble and verify packed test3 environment
        run: |
          mapfile -t chunks < <(find docker/test3/artifacts -maxdepth 1 -type f -name 'test3-linux-64.tar.gz.part-*' | sort)
          if [ "${#chunks[@]}" -eq 0 ]; then
            echo "No test3 archive chunks were downloaded." >&2
            exit 1
          fi
          cat "${chunks[@]}" > docker/test3/artifacts/test3-linux-64.tar.gz
          cd docker/test3
          sha256sum --check --ignore-missing locks/SHA256SUMS

      - name: Set build metadata
        id: meta
        run: |
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Set Docker tags
        id: tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          {
            echo "tags<<EOF"
            echo "${DOCKERHUB_USERNAME}/spatialsnake-test3:${IMAGE_TAG}"
            if [ "${PUSH_LATEST}" = "true" ]; then
              echo "${DOCKERHUB_USERNAME}/spatialsnake-test3:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/test3/Dockerfile
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMAGE_VERSION=${{ inputs.image_tag }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ steps.meta.outputs.short_sha }}
            APP_UID=1000
            APP_GID=1000
          labels: |
            org.opencontainers.image.title=Spatialsnake test3 runtime
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.created=${{ steps.meta.outputs.build_date }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.short_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
