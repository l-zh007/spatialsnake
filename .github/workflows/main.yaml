name: CLI Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal CLI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=80.9.0,<81" wheel docopt PyYAML
          python -m pip install --no-deps -e .

      - name: Test CLI entry points
        run: |
          spatialsnake --version
          spatialsnake -h
          spatialsnake produce-file --option=preprocess
          test -f preprocess.yaml
