# total params
option: "advance_analysis"          # the analysis step for pipeline
results_folder: "results"           # the results data folder name
data_fold: "data"                   # the raw mat data folder name
sample_list: "sample.txt"           # the sample detail information file
run_type: "visium_HD"               # the spatial transcription data type
channel: "single_analysis"          # the channel of analysis style [single_analysis] or [compare_analysis]
runpipe: "cellPhoneDB"

# pysenic
senic_input: "results/Non_Lesional_2/Non_Lesional_2.zarr"
sample_type: "Non_Lesional_2"
tfs_input: "data/allTFs_mm.txt"
feather_input: "data/mm10_10kbp_up_10kbp_down_full_tx_v10_clust.genes_vs_motifs.rankings.feather"
motifs_input: "data/motifs-v10nr_clust-nr.mgi-m0.001-o0.0.tbl"
senic_workers: 128
gene_attr: "var_names"
cell_attr: "cell_id"


#cellphoneDB
cellPhoneDB_input: "results/cellcharter/Colon_Cancer_P2_cellcharter.zarr"
counts_data: "hgnc_symbol"
threshold: 0.1
threads: 16
pvalue: 0.05
output_name: "Colon_Cancer_P2"
iterations: 500
microenvs_file_path: ""
active_tf_path: ""
degs_file_path: ""
niche_col: "spatial_cluster"
is_singlecell: False
cpdb_method: "statistical"
cpdb_de_method: "wilcoxon"
celltype_col: "celltype"
cell_type1: "Endothelial"
cell_type2: "Tumor"
gene_family: ""
microfile:
DEG_file:


#liana 
liana_method: "cellphonedb"
liana_resource_name: "consensus"
liana_expr_prop: 0.1
liana_min_cells: 5
liana_use_raw: true



# cellchat
celltype_col: "celltype"
assay: "Spatial"
species: "human"
min_cells: 10
workers: 32
is_single_cell: FALSE
trim: 0.1
interaction_length: 150


# cellcharter
image_type: "hires"
shape_type: "cell_boundaries"
significance: 0.05
max_cluster: 10
condition_col: "condition"
sample_col: "region"
celltype_col: "celltype"
cellcharter_col: "spatial_cluster"


# banksy
k_geom: 15
max_m: 1
nbr_weight_decay: "scaled_gaussian"
lambda_list: [0.8]



