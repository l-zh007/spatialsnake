# total params
option: "integrate"          # the analysis step for pipeline
results_folder: "results"           # the results data folder name
data_fold: "data"                   # the raw mat data folder name
sample_list: "sample.txt"           # the sample detail information file
run_type: "visium"                  # the spatial transcription data type
channel: "compare_analysis"         # the channel of analysis style [single_analysis] or [compare_analysis]

# intergrate params

cells_boundaries: False             # wherther load in cell boundaries data of xenium in shape
nucleus_boundaries: False           # wherther load in nucleus boundaries data of xenium in shape
nucleus_labels: False               # wherther load in nucleus labels data of xenium in labels
morphology_mip: False               # wherther load in morphology mip data of xenium in images



geojson: 'cell_segmentations.geojson'   # name of visium segment data
image: 'tissue_hires_image.png'         # name of visium segment data 
scale_factors: 'scalefactors_json.json' # name of visium segment data
coor_file: "BeadLocationsForR.csv"      # name of slideseq data













































