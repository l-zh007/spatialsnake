# total params
option: "preprocess"          # the analysis step for pipeline
results_folder: "results"           # the results data folder name
data_fold: "data"                   # the raw mat data folder name
sample_list: "sample.txt"           # the sample detail information file
run_type: "visium"                  # the spatial transcription data type
channel: "compare_analysis"         # the channel of analysis style [single_analysis] or [compare_analysis]



seg_filter: False                   # whether filter the sample with different Standard
filter_list: False                  # file path with different filter Standard of samples
min_genes: 3                        # params of minimal genes contain of each spot
min_cells: 3                        # params of minimal cell contain of each gene
mt_threshold: 80.0                  # the mt params percent to filter the cell
variable: False                     # wheather chose the variable to run other analysis
NEIGHBORS: 10                       # find neighbors params
batch_method: 'harmony'             # whether remove batch effects between samples with [harmony] or [BBKNN]
n_top_genes: 3000                   # the num of top variable  genes 
n_comps: 50                         # pca params
sketch: False                       # whether use sketch method to analysis the spatialdata
sample_rate: 0.30                   # downsample rate of sketch method






