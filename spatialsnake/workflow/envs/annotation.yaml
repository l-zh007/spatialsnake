# total params
option: "annotation"          # the analysis step for pipeline
results_folder: "results"           # the results data folder name
data_fold: "data"                   # the raw mat data folder name
sample_list: "sample.txt"           # the sample detail information file
run_type: "visium"                  # the spatial transcription data type
channel: "compare_analysis"         # the channel of analysis style [single_analysis] or [compare_analysis]
annotation_list: "annotation.txt"

# cell2Location params

anno_algorithm: "mannul"
device: "cuda"
max_epochs_reference: 250
remove_mt: True
N_cells_per_location: 30
max_epochs_st: 30000
labels_key_reference: "annotation_1"
batch_key_reference: "sample"
batch_key_st: "sample"
cell_count_cutoff: 15
cell_percentage_cutoff2: 0.05
nonz_mean_cutoff: 1.12
detection_alpha: 20
save_models: True
celltype_col: "celltype"


# RCTD params
threads: 64
RCTD_mode: "full"
sc_cell_type_col: "annotation_1"
spatial_cell_type_col: "celltype"
group_by: "sample"
max_cores: 8
zarr_input: ""
shape_type: "cell_boundaries"
image_type: "hires"
vis_mode: "auto"
point_size: 2.5
image_slice: False
x1: 0
x2: 0
y1: 0
y2: 0


