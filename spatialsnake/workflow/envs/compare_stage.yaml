# total params
option: "compare_stage"           # 固定为 compare_stage
results_folder: "results"            # 结果输出根目录
data_fold: "data"                    # 原始数据根目录
sample_list: "sample.txt"            # 样本列表文件路径
run_type: "visium"                   # 数据类型: visium/xenium/slide-seq/visium_HD/visium_segment
channel: "compare_analysis"          # 固定为 compare_analysis
runpipe: "compare_gene"              # compare_gene 或 cellchat



# compare_gene
compare_algorithm: 'DEseq2'          # 差异分析算法: DEseq2 或 edgeR
cell_focus: "CAF"                    # 关注的细胞类型名称
spacies: 'human'                     # 物种: human 或 mouse

# compare-cellchat
# 通路与配受体可从 advance_analysis 的 cellchat 输出文件选择:
# 1) results/<sample>/cellchat/<sample>_cellchat_lr.csv  (配体-受体与通路)
# 2) results/<sample>/cellchat/<sample>_cellchat_stats.csv (网络统计)
cellchat_compare_output_dir: "results/compare_cellchat"   # 输出目录
cellchat_compare_sample_name1: "group_Non_Lesional"                   # 样本1显示名称
cellchat_compare_sample_name2: "group_Lesional"                   # 样本2显示名称
cellchat_compare_pathways: ""                             # 通路名列表, 逗号分隔, 例: "CXCL,CCL"
cellchat_compare_source_cells: "1,2,3"                         # 发送细胞: 名称或序号, 例: "Tcell,Bcell" 或 "1,2"
cellchat_compare_target_cells: "1,2,3"                          # 接收细胞: 名称或序号, 例: "Tumor,CAF"
cellchat_compare_receiver_cells: "1,2,3"                    # netVisual_aggregate 接收端: 名称或序号, 例: "CAF" 或 "3"
cellchat_compare_bubble_angle: 45                         # 比较气泡图 x 轴角度
cellchat_compare_bubble_remove_isolate: True              # 是否移除孤立节点
cellchat_compare_do_ranknet: True                         # 是否输出 rankNet 比较图
cellchat_compare_do_role_heatmap: False                    # 是否输出 signaling role heatmap
cellchat_compare_do_pathway_plots: True                   # 是否输出通路汇总图
cellchat_compare_do_compare_overview: True                # 是否输出两组整体比较图
cellchat_compare_do_compare_bubble: True                  # 是否输出 compare bubble (需 source/target)
cellchat_compare_do_single_bubble: True                   # 是否输出单组 bubble (需 source)
cellchat_compare_do_gene_expression: False                # 是否输出 plotGeneExpression
cellchat_compare_gene_colors: "white,#FEC44F,#D95F0E"      # plotGeneExpression 颜色梯度
cellchat_compare_gene_plot_type: "dot"                    # plotGeneExpression 类型: dot 或 heatmap
cellchat_compare_save_merged: True                        # 双样本时是否保存合并后的 rds
