# Spatialsnake compare-stage configuration.
# Edit values only when you need to override the recommended defaults.

# -----------------------------------------------------------------------------
# Common workflow settings
# -----------------------------------------------------------------------------
option: "compare_stage"  # Workflow step selected by this template. Recommended: compare_stage.
results_folder: "results"  # Root directory for all workflow outputs. Recommended: results.
data_fold: "data"  # Root directory used by rules that resolve raw data paths. Recommended: data.
sample_list: "sample.txt"  # Three-column sample table (sample_id input_path group); spaces and tabs are both supported.
run_type: "visium"  # Spatial technology type used to select readers and rules. Recommended: visium unless your platform differs.
channel: "compare_analysis"  # Analysis mode for compare-stage workflows. Recommended: compare_analysis.
runpipe: "compare_gene"  # Compare-stage module to run, such as compare_gene or cellchat. Recommended: compare_gene for DEG analysis.
threads: 4  # Threads allocated to differential analysis or CellChat comparison. Override with --threads when needed.

# -----------------------------------------------------------------------------
# compare_gene pseudobulk DEG options
# -----------------------------------------------------------------------------
compare_algorithm: 'DESeq2'  # Formal pseudobulk DEG method. Recommended: DESeq2 when each group has enough replicates.
cell_focus: "all"  # Cell type(s) analyzed independently; accepts one name, comma-separated names, or all. Recommended: all, then narrow to types of interest when needed.
compare_input_zarr: "results/merge_data/annotation/concatenated_sdata.zarr"  # Optional override; this standard merged annotation zarr is used when the user supplies no CLI value.
compare_contrasts: []  # Optional for exactly two groups (second group vs first group); required for three or more groups.
species: 'human'  # Species used for enrichment resources. Recommended: human or mouse according to the sample source.
cut_off_pvalue: 0.05  # Adjusted p-value cutoff used for DEG plots and enrichment. Recommended: 0.05.
cut_off_logFC: 0.5  # Absolute log2 fold-change cutoff used for DEG plots and enrichment. Recommended: 0.5.
compare_celltype_col: "celltype"  # Observation column containing cell type labels. Recommended: celltype.
compare_sample_col: "sample"  # Observation column containing sample IDs that match sample.txt. Recommended: sample in Spatialsnake merged zarr.
compare_condition_col: "group"  # Observation column containing condition/group labels. Recommended: group from the final sample.txt column.
count_layer: "counts"  # Preferred raw-count layer. If absent/invalid, standard counts, raw_counts, aligned .raw, then integer X are checked in order.
min_replicates: 2  # Minimum biological replicates required per condition for formal DEG testing. Recommended: at least 2.
min_cells_per_sample: 30  # Minimum cells/spots per sample within each selected cell type. Recommended: 30 for stable pseudobulk counts.
min_total_counts_per_gene: 10  # Minimum total pseudobulk counts required per gene. Recommended: 10 to remove very low-expression genes.
de_top_n: 20  # Number of top genes highlighted in DEG plots and summaries. Recommended: 20 for readable figures.
compare_gene_id_type: "auto"  # Gene identifier type used for enrichment: auto, SYMBOL, ENSEMBL, or ENTREZID. Recommended: auto when identifiers are unambiguous.
compare_gene_symbol_col: ""  # Optional SpatialData var column containing gene symbols when var_names are not SYMBOL identifiers.
compare_go_ontology: "BP"  # GO ontology used for enrichment: BP, CC, MF, or ALL. Recommended: BP.
compare_enrichment_top_n: 10  # Maximum enriched terms displayed per panel. Recommended: 10.

# -----------------------------------------------------------------------------
# CellChat comparison options
# -----------------------------------------------------------------------------
cellchat_compare_output_dir: "results/compare_cellchat"  # Output directory for CellChat comparison results.
cellchat_compare_sample_name1: ""  # Optional display name for condition 1; sample.txt sample_id is used when empty.
cellchat_compare_sample_name2: ""  # Optional display name for condition 2; sample.txt sample_id is used when empty.
cellchat_compare_focus_cells: ""  # Recommended simple focus: all directions among comma-separated cell groups.
cellchat_compare_cell_pairs: ""  # Exact directed pairs, e.g. A|B,A<->C; highest-priority cell-scope option.
cellchat_compare_source_cells: ""  # Optional sender groups used when exact pairs and focus_cells are empty.
cellchat_compare_target_cells: ""  # Optional receiver groups used when exact pairs and focus_cells are empty.
cellchat_compare_pathways: ""  # Optional pathways; empty selects pathways with the largest absolute flow difference in the cell scope.
cellchat_compare_lr_pairs: ""  # Optional ligand|receptor pairs; empty selects the largest absolute probability differences.
cellchat_compare_top_cell_pairs: 3  # Directed cell pairs selected automatically when no cell scope is provided.
cellchat_compare_top_pathways: 3  # Pathways selected automatically within the chosen cell scope.
cellchat_compare_top_lr: 20  # Maximum unique LR interactions included in focused comparison plots.
cellchat_compare_plot_advanced: True  # Plot one automatically selected pathway, or every valid manually selected pathway.
cellchat_compare_bubble_angle: 45  # X-axis label angle for CellChat comparison bubble plots. Recommended: 45 for readable labels.
cellchat_compare_bubble_remove_isolate: True  # Remove isolated interactions from bubble plots. Recommended: True for cleaner figures.
cellchat_compare_gene_colors: "white,#FEC44F,#D95F0E"  # Color gradient for CellChat gene-expression plots. Recommended: light-to-warm sequential palette.
cellchat_compare_gene_plot_type: "dot"  # Supported CellChat expression plot: dot, violin, or bar.
cellchat_compare_save_merged: True  # Save merged CellChat objects during pairwise comparison. Recommended: True for reproducibility.
