# Spatialsnake integration configuration.
# Edit values only when you need to override the recommended defaults.

# -----------------------------------------------------------------------------
# Common workflow settings
# -----------------------------------------------------------------------------
option: "integrate"  # Workflow step selected by this template. Recommended: integrate.
results_folder: "results"  # Root directory for all workflow outputs. Recommended: results.
data_fold: "data"  # Raw-data root. Visium Segment is read from {data_fold}/{sample_id}/segmented_outputs.
sample_list: "sample.txt"  # Sample table path with sample IDs and input paths. Recommended: sample.txt or an explicit sample table.
run_type: "visium"  # Spatial technology type used to select readers and rules. Recommended: visium unless your platform differs.
channel: "compare_analysis"  # Analysis mode for single-sample or multi-sample workflows. Recommended: compare_analysis for cohorts.
threads: 4  # Threads allocated to each integration/merge rule. Override with --threads when needed.

# -----------------------------------------------------------------------------
# Xenium input options
# -----------------------------------------------------------------------------
cells_boundaries: False  # Load Xenium cell boundary polygons into SpatialData shapes. Recommended: False unless boundaries are needed.
nucleus_boundaries: False  # Load Xenium nucleus boundary polygons into SpatialData shapes. Recommended: False for faster import.
nucleus_labels: False  # Load Xenium nucleus labels into SpatialData labels. Recommended: False unless label images are required.
morphology_mip: False  # Load Xenium morphology MIP image. Recommended: False unless morphology overview is needed.

# -----------------------------------------------------------------------------
# Visium Segment and Stereo-seq input options
# -----------------------------------------------------------------------------
geojson: 'cell_segmentations.geojson'  # Visium Segment cell segmentation GeoJSON filename. Recommended: cell_segmentations.geojson.
image: 'tissue_hires_image.png'  # High-resolution tissue image filename for segmented Visium input. Recommended: tissue_hires_image.png.
scale_factors: 'scalefactors_json.json'  # Visium scale factor JSON filename used for coordinate mapping. Recommended: scalefactors_json.json.
bin_size: 50  # Fallback bin size for Stereo-seq tissue GEM aggregation. Recommended: define input_spec in sample.txt when possible.

# -----------------------------------------------------------------------------
# MERSCOPE / MERFISH input options
# -----------------------------------------------------------------------------
merscope_z_layers: 3  # Optional MERSCOPE z layers passed to spatialdata-io. Recommended: use "None" for package default or specify layers.
merscope_region_name: "None"  # Optional MERSCOPE region name. Recommended: "None" unless a specific region should be loaded.
merscope_transcripts: True  # Load transcript coordinates from MERSCOPE input. Recommended: True for transcript-level exploration.
merscope_cells_boundaries: True  # Load MERSCOPE cell boundary shapes. Recommended: True when segmentation boundaries are available.
merscope_cells_table: True  # Load MERSCOPE cell-level expression table. Recommended: True for downstream analysis.
merscope_mosaic_images: True  # Load MERSCOPE mosaic images. Recommended: True when image-backed visualization is needed.
