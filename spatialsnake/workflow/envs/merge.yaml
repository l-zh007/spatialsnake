# Spatialsnake useful_tool merge configuration.
# Inputs are supplied on the command line and execution remains direct Python.

# Output and table selection
INPUT:
output_dir: 'results/useful_results'
output_name: 'concatenated_sdata.zarr'
table_key: ''

# Core mode: sample or annotation
merge_by: 'sample'

# Independent-sample concatenation
sample_ids: ''
sample_col: 'sample'
feature_join: 'inner'
label_cols: ''
label_policy: 'preserve'

# Parent annotation overlay
annotation_csv: ''
annotation_col: 'auto'
target_col: 'sub_celltype'
fallback_col: 'celltype'
csv_cell_col: 'auto'
csv_region_col: 'auto'
input_cell_col: 'auto'
input_region_col: 'auto'
conflict_policy: 'error'
existing_policy: 'overwrite_matched'
min_match_rate: 0.95
