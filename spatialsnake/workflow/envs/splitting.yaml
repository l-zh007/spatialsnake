# Spatialsnake useful_tool splitting configuration.
# Edit values only when you need to override the recommended defaults.

# -----------------------------------------------------------------------------
# Input and output options
# -----------------------------------------------------------------------------
INPUT_FILE:  # Input zarr or h5ad path is supplied by the CLI. Recommended: leave empty in the template.
output_zarr_path: "results"  # Legacy output path field retained for compatibility. Recommended: results.
output_dir: 'results/useful_results/data_splitting'  # Final splitting output directory, resolved from the current working directory.

# -----------------------------------------------------------------------------
# Metadata-based splitting
# -----------------------------------------------------------------------------
split_by: "sample"  # Observation metadata column or mode used for splitting. Recommended: sample for per-sample outputs.
barcodes: 'None'  # Optional selected values. Comma combines labels into one output; pipe creates separate outputs. Recommended: None to export all groups.
table_key: ''  # Optional SpatialData table key; empty selects the unambiguous/default table.
subset_mode: 'table'  # table preserves non-table spatial elements; spatial also subsets associated Shapes/Points.

# -----------------------------------------------------------------------------
# Shape and ROI splitting
# -----------------------------------------------------------------------------
shape_elements: 'None'  # SpatialData shape element used for shape-based splitting. Recommended: None unless shapes define ROIs.
roi_csv: ''  # CSV file or directory listing cell IDs for ROI-based splitting. Recommended: set only for ROI workflows.
coordinate_system: ''  # Optional coordinate system for polygon ROI or spatial subsetting.
roi_label_col: ''  # Optional ROI/category column for Loupe or Xenium CSV input.
roi_region: ''  # Optional region used to disambiguate repeated instance IDs in integrated objects.

# -----------------------------------------------------------------------------
# Annotation CSV interoperability
# -----------------------------------------------------------------------------
annotation_format: 'auto'  # Ordinary splitting only: auto, loupe, xenium, both, or none. Distance writes only Zarr and spatial PNG.
annotation_cols: ''  # Ordinary splitting only: optional obs columns exported for Loupe/Xenium visualization.

# -----------------------------------------------------------------------------
# Physical-distance splitting
# -----------------------------------------------------------------------------
distance:  # Outer radius in micrometres. Leave empty to keep the original splitting behaviour.
distance_min: 0  # Inner radius in micrometres; neighbors satisfy distance_min <= d < distance.
neighbor_types: ''  # Optional comma-separated candidate neighbor labels.
neighbor_col: ''  # obs column containing neighbor_types labels.

# -----------------------------------------------------------------------------
# Coordinate crop options
# -----------------------------------------------------------------------------
max_x: 0  # Maximum x coordinate for bounding-box splitting. Recommended: set greater than min_x when cropping.
min_x: 0  # Minimum x coordinate for bounding-box splitting. Recommended: set from tissue coordinates when cropping.
max_y: 0  # Maximum y coordinate for bounding-box splitting. Recommended: set greater than min_y when cropping.
min_y: 0  # Minimum y coordinate for bounding-box splitting. Recommended: set from tissue coordinates when cropping.
